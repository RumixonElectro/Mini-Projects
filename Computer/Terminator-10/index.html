<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .parallax-container {
      height: 100vh;
      overflow-x: hidden;
      perspective: 1px;
    }

    .parallax-layer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      transform-style: preserve-3d;
    }

    .parallax-background {
      background: url('your-background-image.jpg') center/cover fixed;
      height: 100%;
      transform: translateZ(-1px) scale(2);
    }

    .parallax-content {
      position: relative;
      padding: 50px;
      transform: translateZ(1px);
      z-index: 2; /* Ensure content is above the background */
    }

    .parallax-text {
      color: #fff;
      font-size: 36px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="parallax-container">
  <div class="parallax-layer parallax-background"></div>
  <div class="parallax-layer parallax-content">
    <div class="parallax-text">
      Your Parallax Website
    </div>
  </div>
</div>

</body>
</html>
